apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.fullname" . }}-gateway
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: websocket
      port: {{ .Values.gateway.service.wsPort }}
      targetPort: websocket
      protocol: TCP
    - name: admin
      port: {{ .Values.gateway.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "pulse.gatewaySelectorLabels" . | nindent 4 }}

