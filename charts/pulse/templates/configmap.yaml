apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulse.fullname" . }}-config
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
data:
  pulse.yaml: |
    server:
      host: "0.0.0.0"
      ws_port: {{ .Values.gateway.service.wsPort }}
      admin_port: {{ .Values.gateway.service.adminPort }}
      api_port: {{ .Values.cell.service.port }}

    database:
      host: {{ .Values.config.postgres.host | quote }}
      port: {{ .Values.config.postgres.port }}
      name: {{ .Values.config.postgres.database | quote }}
      user: {{ .Values.config.postgres.user | quote }}
      ssl_mode: "require"

    nats:
      url: {{ .Values.config.nats.url | quote }}
      stream_name: {{ .Values.config.nats.streamName | quote }}
      kv_bucket: {{ .Values.config.nats.directoryKvBucket | quote }}

    storage:
      endpoint: {{ .Values.config.storage.endpoint | quote }}
      bucket: {{ .Values.config.storage.bucket | quote }}
      use_ssl: {{ .Values.config.storage.useSsl }}

